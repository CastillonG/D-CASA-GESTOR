<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2e1a0c">
<title>D'Casa Angel's Bakery · Gestión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    /* Paleta "ledger de panadería": espresso oscuro + caramelo, sobre papel cálido */
    --maroon-950:#1c0f06; --maroon-900:#2e1a0c; --maroon-800:#44270f; --maroon-700:#5c3317;
    --gold:#e3b35a; --gold-soft:#fbf3e2; --cream:#f4ecdb; --card-bg:#fffcf5;
    --text-main:#241206; --text-soft:#8a6a46; --border-c:#e3d5bd;
    --danger:#a8402f; --ok:#4f7a4a; --accent:#b9772f;
    --chart1:#2e1a0c; --chart2:#b9772f; --chart3:#8a6a46; --chart4:#d9a85c; --chart5:#8f4a34;
    --font-serif:'Fraunces', Georgia, serif;
    --font-sans:'Inter', -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --card-bg:#241506; --cream:#180e04; --text-main:#f3e7d2; --text-soft:#c7a378; --border-c:#4a3420; --accent:#d79a4c;
    }
  }
  :root[data-theme="dark"]{
    --card-bg:#241506; --cream:#180e04; --text-main:#f3e7d2; --text-soft:#c7a378; --border-c:#4a3420; --accent:#d79a4c;
  }
  body{ background:var(--cream); color:var(--text-main); font-family:var(--font-sans); }
  h1,h2,.brand-name,.chart-title,.kpi .val,.home-btn .lbl,.sec-title{ font-family:var(--font-serif); }
  h2.text-lg{ font-weight:500; font-size:1.5rem; letter-spacing:-.01em; }

  .card{ background:var(--card-bg); border:1px solid var(--border-c); border-radius:.6rem; }

  /* ---- Botones: planos, mínimos, sin sombra ni rebote ---- */
  button{ cursor:pointer; }
  .btn-primary, .btn-soft{
    background:transparent; border:1px solid var(--text-main);
    color:var(--text-main); border-radius:.35rem; font-weight:500; font-size:.85rem;
    padding:.5rem 1rem; transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn-primary:hover{ background:var(--text-main); color:var(--card-bg); }
  .btn-soft{ border-color:var(--accent); color:var(--accent); }
  .btn-soft:hover{ background:var(--accent); color:var(--card-bg); border-color:var(--accent); }

  /* ---- Simulación: tabla tipo hoja ---- */
  .sim-title{ display:inline-block; border:1px solid var(--text-main); background:var(--card-bg); padding:.25rem 3rem; margin-bottom:.6rem; font-style:italic; font-weight:700; font-family:'Inter',sans-serif; }
  .sim-scroll{ overflow:auto; max-height:70vh; border:1px solid #6b4a2b; background:#fff; -webkit-overflow-scrolling:touch; }
  .sim-t{ width:max-content; border-collapse:separate; border-spacing:0; font-family:'Times New Roman',serif; font-size:.78rem; color:#7a1f10; }
  .sim-t th, .sim-t td{ border:1px solid #b8a58d; padding:0; }
  .sim-h{ background:#8b5a2b; color:#fff; font-size:.62rem; text-transform:uppercase; font-weight:700; min-width:92px; max-width:92px; height:44px; padding:2px 4px !important; position:sticky; top:0; z-index:2; position:sticky; vertical-align:middle; }
  .sim-h div{ line-height:1.1; }
  .sim-corner{ background:#fff; position:sticky; left:0; top:0; z-index:4; min-width:130px; }
  .sim-catlbl{ top:44px; z-index:4; font-size:.6rem; color:#8b5a2b; font-style:italic; text-align:right; padding-right:4px !important; }
  .sim-cat{ position:sticky; top:44px; z-index:2; background:#f1e6d6; }
  .sim-cat select{ width:100%; font-size:.62rem; background:transparent; border:none; padding:2px; color:#5a3a1c; text-align:center; }
  .sim-r{ background:#b79b80; color:#3b2312; font-size:.68rem; text-align:left; padding:0 6px !important; position:sticky; left:0; z-index:1; min-width:130px; height:24px; white-space:nowrap; font-weight:700; }
  .sim-r span{ margin-right:1.2rem; }
  .sim-c{ background:#fffdf8; height:24px; }
  .sim-cell{ width:100%; min-width:90px; height:24px; border:none; background:transparent; text-align:right; padding:0 4px; font:inherit; color:#7a1f10; border-radius:0; }
  .sim-cell:focus{ outline:2px solid #8b5a2b; outline-offset:-2px; background:#fff3d6; }
  .sim-blank{ background:#fffdf8; }
  .sim-tot, .sim-grand{ background:#fff; color:#111; font-weight:700; text-align:right; padding:0 6px !important; font-family:'Inter',sans-serif; font-size:.78rem; }
  .sim-tot-h{ background:#fff !important; color:#7a1f10 !important; min-width:70px; }
  .sim-add{ cursor:pointer; background:#f1e6d6 !important; color:#8b5a2b !important; font-size:.9rem !important; min-width:44px; text-align:center !important; }
  .sim-r.sim-add{ text-align:left !important; font-size:.72rem !important; }
  .sim-add:hover{ background:#e3d0b6 !important; }
  .sim-sum td{ background:#fff; text-align:center; font-family:'Inter',sans-serif; font-size:.75rem; color:#111; height:22px; }
  .sim-sumlbl{ background:#fff !important; color:#8b5a2b !important; font-style:italic; }
  .sim-x{ background:none; border:none; font-size:.6rem; opacity:.55; color:inherit; margin-left:2px; }
  .sim-h .sim-x{ position:absolute; top:0; right:1px; color:#fff; }
  .sim-r .sim-x{ position:absolute; right:3px; top:4px; }
  .sim-x:hover{ opacity:1; }
  .sim-types{ display:flex; flex-wrap:wrap; gap:.5rem; }
  .sim-type{ border:1px solid #6b4a2b; background:#fff; min-width:108px; text-align:center; font-family:'Inter',sans-serif; }
  .sim-type div{ background:#8b5a2b; color:#fff; font-size:.68rem; font-weight:700; padding:.15rem .4rem; }
  .sim-type b{ display:block; font-size:1.05rem; padding:.2rem 0 0; color:#111; }
  .sim-type small{ display:block; font-size:.65rem; color:#8b5a2b; padding-bottom:.2rem; }
  .sim-type-t div{ background:#2e1a0c; }
  .sim-cell, .sim-rn{ padding:0 4px !important; height:24px !important; min-height:0 !important; border:none !important; box-shadow:none !important; border-radius:0 !important; background:transparent; font-size:.78rem; }
  .sim-rn{ width:100%; min-width:100px; text-align:left; font-weight:700; color:#3b2312; }
  .sim-cat select{ padding:2px !important; min-height:0 !important; border:none !important; box-shadow:none !important; }
  .sim-add-c{ cursor:ew-resize; touch-action:none; user-select:none; }
  .sim-add-r{ cursor:ns-resize; touch-action:none; user-select:none; }
  .sim-pop{ position:fixed; z-index:90; background:var(--card-bg); border:1px solid var(--text-main); border-radius:.6rem; padding:.7rem; max-width:min(420px,92vw); max-height:60vh; overflow:auto; }

  /* ---- Botón + y venta rápida ---- */
  .fab{ position:fixed; right:18px; bottom:18px; width:56px; height:56px; border-radius:50%; background:var(--text-main); color:var(--card-bg); border:none; font-size:2rem; line-height:1; z-index:60; display:flex; align-items:center; justify-content:center; }
  .fab.open{ transform:rotate(45deg); }
  .qmenu{ position:fixed; right:18px; bottom:84px; z-index:60; display:flex; flex-direction:column; gap:.5rem; align-items:flex-end; }
  .qmenu button{ min-height:48px; padding:.6rem 1.1rem; border-radius:.6rem; background:var(--card-bg); color:var(--text-main); border:1px solid var(--text-main); font-weight:600; font-size:.95rem; }
  .qover{ position:fixed; inset:0; background:rgba(20,10,2,.55); z-index:70; display:flex; align-items:flex-end; justify-content:center; }
  .qsheet{ background:var(--cream); width:100%; max-width:640px; max-height:94vh; overflow:auto; border-radius:1rem 1rem 0 0; padding:1rem 1rem 6rem; position:relative; }
  .qsheet h3{ font-family:'Fraunces',serif; font-size:1.15rem; font-weight:700; margin-bottom:.5rem; }
  .qlbl{ font-size:.7rem; letter-spacing:.08em; text-transform:uppercase; color:var(--text-soft); margin:.9rem 0 .35rem; font-weight:600; }
  .qchips{ display:flex; flex-wrap:wrap; gap:.4rem; }
  .qchip{ min-height:46px; padding:.45rem .9rem; border-radius:.6rem; border:1px solid var(--border-c); background:var(--card-bg); color:var(--text-main); font-size:.9rem; }
  .qchip.on{ background:var(--text-main); color:var(--card-bg); border-color:var(--text-main); }
  .qtile{ display:flex; align-items:center; justify-content:space-between; gap:.4rem; min-height:50px; padding:.3rem .5rem .3rem .75rem; border-radius:.6rem; border:1px solid var(--border-c); background:var(--card-bg); font-size:.85rem; text-align:left; }
  .qtile.on{ border-color:var(--text-main); background:var(--gold-soft); }
  .qtile .qn{ display:flex; align-items:center; gap:.25rem; }
  .qtile .qn button{ width:38px; height:38px; border-radius:.5rem; border:1px solid var(--text-main); background:var(--card-bg); color:var(--text-main); font-size:1.2rem; line-height:1; }
  .qtile .qn b{ min-width:1.4rem; text-align:center; }
  .qfoot{ position:sticky; bottom:-6rem; margin:1rem -1rem -6rem; padding:.8rem 1rem; background:var(--cream); border-top:1px solid var(--border-c); display:flex; gap:.6rem; align-items:center; }
  .qfoot .btn-primary{ flex:1; min-height:50px; background:var(--text-main); color:var(--card-bg); font-size:1rem; }

  /* botones de icono/texto simples (eliminar, editar) */
  button.text-xs{ background:none; border:none; padding:.1rem 0; text-decoration:underline; text-decoration-color:transparent; transition:text-decoration-color .15s; }
  button.text-xs:hover{ text-decoration-color:currentColor; }

  .home-btn{
    background:transparent; border:none; border-bottom:1px solid var(--border-c); border-radius:0;
    transition:background .15s ease; padding:1.1rem .5rem !important;
  }
  .home-btn:hover{ background:rgba(185,119,47,.07); }
  .home-btn .lbl{ font-size:.95rem; font-weight:500; }

  input, select, textarea{ background:var(--card-bg); border:1px solid var(--border-c); color:var(--text-main); border-radius:.4rem; padding:.4rem .6rem; font-family:var(--font-sans); }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--accent); outline-offset:1px; }
  table{ border-collapse:collapse; width:100%; font-size:.85rem; }
  th{ text-align:left; color:var(--text-soft); font-weight:600; padding:.5rem .5rem; border-bottom:1px solid var(--text-main); font-size:.75rem; }
  td{ padding:.55rem .5rem; border-bottom:1px solid var(--border-c); }
  .pagado-row{ opacity:.5; }

  /* ---- Tabs: subrayado mínimo ---- */
  .tab-btn{
    background:transparent !important; border:none !important; border-radius:0 !important;
    color:var(--text-soft); font-weight:500; padding:.4rem 0 !important; margin-right:1.3rem;
    border-bottom:1px solid transparent; transition:color .15s, border-color .15s;
  }
  .tab-btn:hover{ color:var(--text-main); }
  .tab-btn.active{ color:var(--text-main); border-bottom-color:var(--accent); border-bottom-width:2px; }

  .scrollx{ overflow-x:auto; }
  ::-webkit-scrollbar{ height:6px; width:6px; } ::-webkit-scrollbar-thumb{ background:var(--border-c); border-radius:3px; }

  .brand-header{ background:var(--maroon-900); border-radius:.6rem; border-bottom:2px solid var(--accent); }
  .brand-name{ font-style:italic; font-weight:500; letter-spacing:0; }

  .kpi{ border-bottom:1px solid var(--border-c); border-radius:0; padding:0 0 .6rem 0; background:transparent; }
  .kpi .lbl{ font-size:.72rem; color:var(--text-soft); font-weight:500; }
  .kpi .val{ font-size:1.6rem; font-weight:500; color:var(--text-main); line-height:1.15; }
  button.kpi{ display:block; width:100%; text-align:left; transition:border-color .15s; }
  button.kpi:hover{ border-bottom-color:var(--accent); }

  /* ---- Hub: calendario ---- */
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  .cal-dow{ font-size:.7rem; color:var(--text-soft); text-align:center; padding:.2rem 0; }
  .cal-day{ min-height:44px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; border-radius:.35rem; font-size:.85rem; background:transparent; border:1px solid transparent; color:var(--text-main); }
  .cal-day:hover{ background:rgba(185,119,47,.09); }
  .cal-day.today{ border-color:var(--accent); }
  .cal-day.sel{ background:var(--text-main); color:var(--card-bg); }
  .cal-dots{ display:flex; gap:2px; height:5px; }
  .cal-dots i, .dot{ width:6px; height:6px; border-radius:50%; display:inline-block; flex-shrink:0; }
  .cal-dots i{ width:5px; height:5px; }
  .cal-day.sel .cal-dots i{ outline:1px solid var(--card-bg); }
  .hub-row{ display:flex; gap:.6rem; align-items:center; padding:.5rem 0; border-bottom:1px solid var(--border-c); width:100%; text-align:left; font-size:.85rem; }
  button.hub-row:hover{ background:rgba(185,119,47,.07); }

  .chart-card{ background:var(--card-bg); border:1px solid var(--border-c); border-radius:.6rem; padding:1.1rem; }
  .chart-title{ font-size:1rem; font-style:italic; font-weight:500; color:var(--text-main); margin-bottom:.7rem; }

  .save-indicator{ position:fixed; bottom:84px; right:14px; background:var(--text-main); color:var(--card-bg); padding:.4rem .8rem; border-radius:.35rem; font-size:.75rem; z-index:50; transition:opacity .2s; }



  /* ---- Retroalimentación: toasts, sin conexión, estados vacíos ---- */
  .toasts{ position:fixed; top:calc(var(--top-h) + 10px); left:50%; transform:translateX(-50%); z-index:90; display:flex; flex-direction:column; gap:.5rem; width:min(440px, calc(100vw - 32px)); pointer-events:none; }
  @media(min-width:1024px){ .toasts{ left:calc(50% + var(--side-w)/2); } }
  .toast{ pointer-events:auto; display:flex; align-items:flex-start; gap:.65rem; padding:.7rem .8rem .7rem .9rem; border-radius:12px; background:var(--text-main); color:var(--card-bg); font-size:.86rem; line-height:1.35; box-shadow:0 8px 24px rgba(36,18,6,.25); animation:tIn .18s ease-out; }
  .toast.out{ animation:tOut .18s ease-in forwards; }
  .toast .ti{ flex-shrink:0; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:800; margin-top:1px; }
  .toast.ok .ti{ background:#7fc27a; color:#173d14; }
  .toast.err{ background:#7a2418; } .toast.err .ti{ background:#fff; color:#7a2418; }
  .toast.warn .ti{ background:var(--gold); color:var(--maroon-950); }
  .toast.info .ti{ background:rgba(255,255,255,.18); color:#fff; }
  .toast .tm{ flex:1; }
  .toast .ta{ flex-shrink:0; background:none; border:none; color:var(--gold); font-weight:700; font-size:.85rem; min-height:28px; padding:0 .3rem; text-decoration:underline; text-underline-offset:3px; }
  .toast .tx{ flex-shrink:0; background:none; border:none; color:rgba(255,255,255,.6); font-size:1rem; min-height:24px; padding:0 .2rem; }
  @keyframes tIn{ from{ opacity:0; transform:translateY(-8px); } to{ opacity:1; transform:none; } }
  @keyframes tOut{ to{ opacity:0; transform:translateY(-8px); } }
  .offline-bar{ position:fixed; top:var(--top-h); left:0; right:0; z-index:54; background:#7a2418; color:#fff; font-size:.8rem; padding:.45rem 16px; text-align:center; }
  @media(min-width:1024px){ .offline-bar{ left:var(--side-w); } }
  .tb-sync.off{ background:#9b9b9b; }
  .tb-sync.busy{ background:var(--gold); animation:pulse 1s infinite; }
  @keyframes pulse{ 50%{ opacity:.35; } }
  .empty{ text-align:center; padding:1.6rem 1rem; border:1.5px dashed var(--border-c); border-radius:var(--radius); background:var(--card-bg); }
  .empty .ei{ font-size:1.6rem; }
  .empty h4{ font-weight:700; margin-top:.35rem; }
  .empty p{ font-size:.82rem; color:var(--text-soft); margin:.25rem auto .8rem; max-width:320px; }
  .empty button{ min-height:40px; padding:0 1rem; border-radius:10px; background:var(--text-main); color:var(--card-bg); font-weight:600; font-size:.85rem; border:none; }
  .conn-card{ background:var(--card-bg); border:1px solid var(--border-c); border-left:4px solid var(--danger); border-radius:var(--radius); padding:.9rem 1rem; font-size:.85rem; width:100%; }
  .conn-card b{ display:block; margin-bottom:.2rem; }
  .conn-card button{ margin-top:.6rem; min-height:38px; padding:0 1rem; border-radius:10px; background:var(--text-main); color:var(--card-bg); font-weight:600; border:none; }

  /* ---- Venta por voz ---- */
  .voz{ display:flex; align-items:center; gap:.8rem; background:var(--card-bg); border:1px solid var(--border-c); border-radius:14px; padding:.75rem .85rem; margin-top:.75rem; }
  .voz-btn{ width:56px; height:56px; border-radius:50%; border:none; background:var(--accent); color:#fff; flex-shrink:0; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(185,119,47,.35); }
  .voz-btn svg{ width:26px; height:26px; }
  .voz-btn.on{ background:#b3261e; animation:vozPulse 1.2s infinite; }
  @keyframes vozPulse{ 0%{ box-shadow:0 0 0 0 rgba(179,38,30,.5);} 70%{ box-shadow:0 0 0 14px rgba(179,38,30,0);} 100%{ box-shadow:0 0 0 0 rgba(179,38,30,0);} }
  .voz-t{ font-weight:700; font-size:.92rem; }
  .voz-s{ font-size:.78rem; color:var(--text-soft); margin-top:.15rem; line-height:1.35; }
  .voz-live{ font-style:italic; color:var(--text-main); }
  .voz-res{ background:#eef5ec; border:1px solid #cfe3ca; border-radius:12px; padding:.7rem .85rem; margin-top:.6rem; font-size:.82rem; }
  .voz-res.warn{ background:#fbf0dc; border-color:#efd9ad; }
  .voz-res q{ font-style:italic; }
  .voz-res .chips{ display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.45rem; }
  .voz-res .chips span{ background:#fff; border:1px solid var(--border-c); border-radius:999px; padding:.15rem .55rem; font-size:.74rem; font-weight:600; }
  .voz-res .acc{ display:flex; gap:1rem; margin-top:.5rem; }
  .voz-res .acc button{ background:none; border:none; padding:0; font-weight:700; font-size:.8rem; color:var(--accent); min-height:28px; }
  .voz-edit{ width:100%; min-height:70px; margin-top:.5rem; border:1px solid var(--border-c); border-radius:10px; padding:.5rem .6rem; font-size:16px; background:#fff; }
  /* ---- Cursos y eventos ---- */
  .ag-sum{ display:grid; grid-template-columns:repeat(2,1fr); gap:.6rem; margin-bottom:14px; }
  @media(min-width:640px){ .ag-sum{ grid-template-columns:repeat(4,1fr); } }
  .ag-sum button{ text-align:left; background:var(--card-bg); border:1px solid var(--border-c); border-radius:var(--radius); padding:.75rem .9rem; box-shadow:var(--shadow); }
  .ag-sum button.on{ border-color:var(--text-main); box-shadow:0 0 0 1px var(--text-main); }
  .ag-sum .n{ font-family:var(--font-serif); font-size:1.6rem; line-height:1; }
  .ag-sum .l{ font-size:.72rem; color:var(--text-soft); margin-top:.3rem; }
  .ag-filtros{ display:flex; gap:.4rem; overflow-x:auto; margin-bottom:12px; padding-bottom:2px; }
  .ag-chip{ white-space:nowrap; min-height:36px; padding:0 .9rem; border-radius:999px; border:1px solid var(--border-c); background:var(--card-bg); font-size:.82rem; font-weight:600; color:var(--text-main); }
  .ag-chip.on{ background:var(--text-main); color:var(--card-bg); border-color:var(--text-main); }
  .ag-grupo{ font-size:.7rem; letter-spacing:.1em; text-transform:uppercase; color:var(--text-soft); margin:18px 0 8px; display:flex; align-items:center; gap:.5rem; }
  .ag-grupo::after{ content:''; flex:1; height:1px; background:var(--border-c); }
  .ag-item{ display:flex; gap:.8rem; background:var(--card-bg); border:1px solid var(--border-c); border-radius:var(--radius); padding:.85rem .95rem; margin-bottom:.55rem; box-shadow:var(--shadow); border-left:4px solid var(--c); }
  .ag-item.usado{ opacity:.55; }
  .ag-fecha{ flex-shrink:0; width:52px; text-align:center; border-radius:10px; background:var(--gold-soft); padding:.35rem 0; align-self:flex-start; }
  .ag-fecha b{ display:block; font-family:var(--font-serif); font-size:1.35rem; line-height:1; }
  .ag-fecha span{ font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-soft); }
  .ag-body{ flex:1; min-width:0; }
  .ag-body h4{ font-weight:600; font-size:.95rem; line-height:1.25; }
  .ag-body p{ font-size:.78rem; color:var(--text-soft); margin-top:.2rem; }
  .ag-meta{ display:flex; flex-wrap:wrap; gap:.35rem; margin-top:.45rem; align-items:center; }
  .ag-badge{ font-size:.7rem; font-weight:700; padding:.15rem .55rem; border-radius:999px; background:var(--gold-soft); color:var(--text-main); }
  .ag-badge.rojo{ background:#f6dcd5; color:#9a2f1f; }
  .ag-badge.ambar{ background:#f8e7c9; color:#8a5a12; }
  .ag-badge.verde{ background:#dcebd8; color:#3a6a35; }

function allEventos(){
  const auto = hubData.producciones.filter(p=>p.semana).map(p=>({
    id:'prod_'+p.id, fecha:p.semana, auto:true, tipo:'produccion',
    titulo:'Producción: '+(p.items||[]).reduce((a,it)=>a+num(it.cantidad),0)+' pzas'
  }));
  return hubData.eventos.concat(auto);
}
function inventarioBajo(insumos, producciones, sabores){
  const saboresMap = Object.fromEntries(sabores.map(s=>[s.nombre,s]));
  const semanas = new Set(); const total = {};
  producciones.forEach(p=>{ semanas.add(p.semana); (p.items||[]).forEach(it=>{
    const s = saboresMap[it.sabor]; if(!s) return;
    (s.insumosUsados||[]).forEach(u=>{ total[u.insumoId]=(total[u.insumoId]||0)+u.cantidad/(num(s.rinde)||1)*it.cantidad; });
  });});
  const n = Math.max(1, semanas.size);
  return insumos.filter(i=> num(i.existencia) < ((total[i.id]||0)/n)*0.25 );
}

let _certSembrado = false;
async function sembrarCertificados(){
  if(_certSembrado) return false; _certSembrado = true;
  const db = await ensureDB(); if(!db) return false;
  try{
    const config = await colGet('config');
    if(config.some(d=>d.id==='seedCertificados2026')) return false;   // ya se agregaron antes (respeta si borraste alguno)
    const existentes = new Set(hubData.eventos.map(e=>e.id));
    let n = 0;
    for(const c of CERTIFICADOS){
      if(existentes.has(c.id)) continue;                               // nunca sobrescribe
      const {id, ...ev} = c; const data = {...ev, tipo:'certificado'};
      await db.collection('eventos').doc(id).set(data);
      hubData.eventos.push({id, ...data}); n++;
    }
    await db.collection('config').doc('seedCertificados2026').set({fecha:new Date().toISOString(), agregados:n});
    return n>0;
  }catch(e){ console.error('No se pudieron agregar los certificados', e); _certSembrado = false; return false; }
}

async function refreshHub(){
  const [ventas, insumos, eventos, producciones, sabores] = await Promise.all([
    colGet('ventas'), colGet('insumos'), colGet('eventos'), colGet('producciones'), colGet('sabores')
  ]);
  hubData = {ventas, insumos, eventos, producciones, sabores};
  await sembrarCertificados();
  if(!document.getElementById('hubKpis')) return; // el usuario ya navegó a otra sección
  renderHubKpis(); renderCalendar(); renderUpcoming(); renderAlerts();
}

function renderHubKpis(){
  const el = document.getElementById('hubKpis'); if(!el) return;
  const hoy = ymd(new Date()), mes = hoy.slice(0,7), en7 = ymd(new Date(Date.now()+7*86400000));
  const vv = hubData.ventas.filter(v=>v.estado==='venta');
  const totalMes = vv.filter(v=>(v.fecha||'').slice(0,7)===mes).reduce((a,v)=>a+num(v.monto),0);
  const porCobrar = vv.filter(v=>!v.pagado).reduce((a,v)=>a+num(v.monto),0);
  const bajos = inventarioBajo(hubData.insumos, hubData.producciones, hubData.sabores).length;
  const prox = allEventos().filter(e=>e.fecha>=hoy && e.fecha<=en7).length;
  el.innerHTML = `
    <button class="kpi" onclick="go('dashboard')"><span class="go">→</span><p class="lbl">Ventas del mes</p><p class="val">${moneyShort(totalMes)}</p></button>
    <button class="kpi" onclick="go('ventas')"><span class="go">→</span><p class="lbl">Por cobrar</p><p class="val">${moneyShort(porCobrar)}</p></button>
    <button class="kpi" onclick="go('inventario')"><span class="go">→</span><p class="lbl">Insumos por comprar</p><p class="val">${bajos}</p></button>
    <div class="kpi"><p class="lbl">Eventos en 7 días</p><p class="val">${prox}</p></div>`;
}

function renderCalendar(){
  const box = document.getElementById('calBox'); if(!box) return;
  const y = calCursor.getFullYear(), m = calCursor.getMonth();
  const startDow = (new Date(y,m,1).getDay()+6)%7; // semana inicia en lunes
  const days = new Date(y,m+1,0).getDate();
  const byDay = {};
  allEventos().forEach(e=>{ (byDay[e.fecha]=byDay[e.fecha]||[]).push(e); });
  const hoy = ymd(new Date());
  let cells = '';
  for(let i=0;i<startDow;i++) cells += '<span></span>';
  for(let d=1; d<=days; d++){
    const key = y+'-'+pad2(m+1)+'-'+pad2(d);
    const dots = (byDay[key]||[]).slice(0,3).map(e=>`<i style="background:${EVENT_COLORS[e.tipo]||EVENT_COLORS.otro}"></i>`).join('');
    cells += `<button class="cal-day ${key===hoy?'today':''} ${key===calSel?'sel':''}" onclick="calPick('${key}')"><span>${d}</span><span class="cal-dots">${dots}</span></button>`;
  }
  const mesTxt = calCursor.toLocaleDateString('es-MX',{month:'long', year:'numeric'});
  const selEvs = byDay[calSel]||[];
  box.innerHTML = `
    <div class="flex items-center justify-between mb-3">
      <p class="chart-title" style="margin:0;text-transform:capitalize">${mesTxt}</p>
      <div class="flex gap-1">
        <button class="btn-soft" style="padding:.2rem .65rem" onclick="calMove(-1)" aria-label="Mes anterior">‹</button>
        <button class="btn-soft" style="padding:.2rem .65rem" onclick="calGoToday()">Hoy</button>
        <button class="btn-soft" style="padding:.2rem .65rem" onclick="calMove(1)" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <div class="cal-grid mb-1">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<span class="cal-dow">${d}</span>`).join('')}</div>
    <div class="cal-grid">${cells}</div>
    <div class="mt-4 pt-3" style="border-top:1px solid var(--border-c)">
      <p class="text-sm font-medium mb-1" style="text-transform:capitalize">${fmtDay(calSel)}</p>
      ${selEvs.map(e=>`<div class="hub-row"><i class="dot" style="background:${EVENT_COLORS[e.tipo]||EVENT_COLORS.otro}"></i>
        <span style="flex:1">${esc(e.titulo)} <span class="text-xs" style="color:var(--text-soft)">${EVENT_TYPES[e.tipo]||''}${e.nota?': '+esc(e.nota):''}</span></span>
        ${e.auto?'':`<button class="text-xs" style="color:var(--danger)" onclick="delEvento('${e.id}')">eliminar</button>`}</div>`).join('')
        || '<p class="text-xs py-2" style="color:var(--text-soft)">Sin eventos este día.</p>'}
      <div class="grid grid-cols-2 gap-2 mt-3 text-sm">
        <input id="ev_titulo" placeholder="Evento (ej. entrega a punto de venta)" class="col-span-2">
        <select id="ev_tipo">${Object.entries(EVENT_TYPES).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select>
        <input id="ev_nota" placeholder="Nota (opcional)">
        <button class="btn-primary col-span-2" onclick="addEvento()">Agregar al calendario</button>
      </div>
    </div>`;
}

function renderUpcoming(){

function toast(msg, {tipo='info', accion=null, dur=null}={}){
  const box = document.getElementById('toasts'); if(!box) return;
  if([...box.querySelectorAll('.tm')].some(x=>x.textContent===msg)) return; // no repetir el mismo aviso
  const ic = {ok:'✓', err:'!', warn:'!', info:'i'}[tipo] || 'i';
  const t = document.createElement('div'); t.className = 'toast '+tipo; t.setAttribute('role', tipo==='err'?'alert':'status');
  t.innerHTML = `<span class="ti">${ic}</span><span class="tm"></span>${accion?'<button class="ta"></button>':''}<button class="tx" aria-label="Cerrar">✕</button>`;
  t.querySelector('.tm').textContent = msg;
  const cerrar = ()=>{ if(!t.isConnected) return; t.classList.add('out'); setTimeout(()=>t.remove(), 180); };
  if(accion){ const b = t.querySelector('.ta'); b.textContent = accion.txt; b.onclick = ()=>{ cerrar(); accion.fn(); }; }
  t.querySelector('.tx').onclick = cerrar;
  box.appendChild(t);
  while(box.children.length > 3) box.firstChild.remove();
  setTimeout(cerrar, dur || (accion ? 7000 : tipo==='err' ? 8000 : 3200));
  return t;
}

let dbReadyResolve;

async function colGet(name){
  const db = await ensureDB();
  if(!db) return [];
  try{
    const snap = await db.collection(name).get();
    return snap.docs.map(d=>{ const data = d.data(); CACHE[name+'/'+d.id] = data; return {id:d.id, ...data}; });
  }catch(e){
    console.error(e);
    if(e && e.code==='permission-denied'){
      $status.innerHTML = '<div class="conn-card"><b>Sin permiso para ver los datos</b>La cuenta '+esc(USER_EMAIL)+' no está autorizada. En Firebase Console → Firestore → Reglas, agrega este correo y pulsa Publicar.<br><button onclick="location.reload()">Ya lo agregué, reintentar</button></div>';
    }
    return [];
  }
}
const MSG_ERR = {
  'permission-denied':'Tu cuenta no tiene permiso para guardar. Revisa las reglas de Firestore.',
  'unavailable':'No hay conexión con el servidor.',
  'deadline-exceeded':'El servidor tardó demasiado.',
  'resource-exhausted':'Se alcanzó el límite de uso de Firebase por hoy.'
};
const conLimite = (p, ms, aviso) => { const t = setTimeout(aviso, ms); return p.finally(()=>clearTimeout(t)); };
async function docSet(col,id,data){
  const db = await ensureDB();
  if(!db){ toast('Todavía estoy conectando con la nube. Espera unos segundos e inténtalo de nuevo.', {tipo:'warn'}); throw new Error('db_unavailable'); }
  let noSync = false;
  if(col==='ventas'){ data = {...data}; noSync = !!data._noSync; delete data._noSync; if(data._ts){ data.actualizado = data._ts; delete data._ts; } else data.actualizado = Date.now(); }
  trabajando(true);
  try{
    await conLimite(db.collection(col).doc(id).set(data), 7000, ()=>toast('Está tardando más de lo normal. Revisa tu conexión; se guardará en cuanto responda.', {tipo:'warn'}));
    CACHE[col+'/'+id] = data;
    if(col==='ventas' && !noSync) sheetsProgramar();
  }catch(e){
    console.error(e);
    const code = (e&&e.code||'').replace('firestore/','');
    toast('No se guardó: '+(MSG_ERR[code] || 'ocurrió un error ('+(code||'desconocido')+').'),
      {tipo:'err', accion:{txt:'Reintentar', fn:async()=>{ try{ await docSet(col,id,data); toast('Guardado.', {tipo:'ok'}); rePintar(); }catch(_){} }}});
    throw e;
  }finally{ trabajando(false); }
}
async function docDelete(col,id,{silencioso=false}={}){
  const db = await ensureDB();
  if(!db){ toast('Todavía estoy conectando con la nube. Espera unos segundos e inténtalo de nuevo.', {tipo:'warn'}); throw new Error('db_unavailable'); }
  const previo = CACHE[col+'/'+id];
  trabajando(true);
  try{
    await db.collection(col).doc(id).delete();
    delete CACHE[col+'/'+id];
    if(!silencioso){
      const n = nombreDe(previo);
      toast('Eliminado'+(n?': '+n:'')+'.', previo ? {tipo:'info', accion:{txt:'Deshacer', fn:async()=>{
        try{ await docSet(col,id,previo); toast('Recuperado'+(n?': '+n:'')+'.', {tipo:'ok'});
          if(col==='eventos' && hubData.eventos && !hubData.eventos.some(x=>x.id===id)) hubData.eventos.push({id, ...previo});
          rePintar(); }catch(_){}
      }}} : {tipo:'info'});
    }
  }catch(e){
    console.error(e);
    const code = (e&&e.code||'').replace('firestore/','');
    toast('No se eliminó: '+(MSG_ERR[code] || 'ocurrió un error ('+(code||'desconocido')+').'), {tipo:'err', accion:{txt:'Reintentar', fn:()=>docDelete(col,id).then(rePintar).catch(()=>{})}});
    throw e;
  }finally{ trabajando(false); }
}

function costoUnitarioInsumo(ins){
  const cant = num(ins.cantidadPresentacion) || 1;
  return num(ins.costo) / cant;
}
function costoEstandarInsumo(ins){
  let factor=1, base=ins.unidad;
  const cant = num(ins.cantidadPresentacion) || 1;
  if(ins.unidad==='g'){ factor = 1000/cant; base='kg'; }
  else if(ins.unidad==='kg'){ factor = 1/cant; base='kg'; }
  else if(ins.unidad==='ml'){ factor = 1000/cant; base='l'; }
  else if(ins.unidad==='l'){ factor = 1/cant; base='l'; }
  else { factor = 1/cant; base='pza'; }
  return { valor: num(ins.costo)*factor, base };
}
function costoProduccionSabor(sabor, insumosMap){
  // Las cantidades de insumos son por tanda; 'rinde' = piezas por tanda. Resultado: costo por pieza.
  let lote = 0;
  (sabor.insumosUsados||[]).forEach(u=>{
    const ins = insumosMap[u.insumoId];
    if(ins) lote += costoUnitarioInsumo(ins) * num(u.cantidad);
  });
  return lote/(num(sabor.rinde)||1) + num(sabor.manoObra) + num(sabor.empaque);
}

async function initFirebase(){
  const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp}, A, F] = await Promise.all([
    import(V+'firebase-app.js'), import(V+'firebase-auth.js'), import(V+'firebase-firestore.js')
  ]);
  const app = initializeApp(firebaseConfig);
  const auth = A.getAuth(app);
  const fs = F.getFirestore(app);

  try{ await A.setPersistence(auth, A.browserLocalPersistence); }catch(e){}
  // Si regresamos de un inicio de sesión por redirección, recoger el resultado
  let redirErr = null;
  try{ await A.getRedirectResult(auth); }catch(e){ redirErr = e; console.error(e); }
  let user = await new Promise(res=>{ const un = A.onAuthStateChanged(auth, u=>{ un(); res(u); }); });
  if(!user){
    const MSG = {
      'auth/unauthorized-domain': 'Este dominio ('+location.hostname+') no está autorizado. En Firebase Console → Authentication → Settings → Dominios autorizados, agrega: '+location.hostname,
      'auth/operation-not-allowed': 'El acceso con Google está desactivado. Actívalo en Firebase Console → Authentication → Sign-in method → Google.',
      'auth/network-request-failed': 'Sin conexión a internet o la red bloquea Google. Revisa tu conexión.',
      'auth/internal-error': 'Error interno de Google. Cierra la pestaña, vuelve a abrir la página y reintenta.',
      'auth/web-storage-unsupported': 'El navegador bloquea el almacenamiento (modo incógnito o cookies desactivadas). Usa una ventana normal.'
    };
    const pintarLogin = err => {
      const code = err && err.code ? err.code : '';
      $status.innerHTML = '<div style="display:flex;flex-direction:column;gap:.5rem;width:100%;max-width:420px">'
        + '<button id="loginBtn" class="btn-primary">Entrar con Google</button>'
        + (err ? '<p style="color:var(--danger);font-size:.8rem">No se pudo iniciar sesión'+(code?' ('+esc(code)+')':'')+'. '+esc(MSG[code]||(err.message||''))+'</p>' : '')
        + '</div>';
    };
    pintarLogin(redirErr);
    user = await new Promise(res=>{
      const conectar = ()=>{
        document.getElementById('loginBtn').onclick = async ()=>{
          const prov = new A.GoogleAuthProvider(); prov.setCustomParameters({prompt:'select_account'});
          try{ const r = await A.signInWithPopup(auth, prov); res(r.user); }
          catch(e){
            console.error(e);
            const code = e && e.code || '';
            // Si la ventana emergente no funciona (bloqueada, cerrada, navegador de app, celular), entrar por redirección
            if(['auth/popup-blocked','auth/popup-closed-by-user','auth/cancelled-popup-request','auth/operation-not-supported-in-this-environment','auth/web-storage-unsupported'].includes(code)){
              try{ await A.signInWithRedirect(auth, prov); return; }catch(e2){ console.error(e2); pintarLogin(e2); conectar(); return; }
            }
            pintarLogin(e); conectar();
          }
        };
      };
      conectar();
    });
  }
  USER_EMAIL = user.email; document.getElementById('tbSync').className='tb-sync ok'; pintarConexion();
  $status.innerHTML = 'Sesión: '+esc(user.email)+' · guardado en la nube · v'+APP_VERSION+' · <button id="logoutBtn" class="text-xs" style="text-decoration:underline">salir</button>';
  document.getElementById('logoutBtn').onclick = async ()=>{ await A.signOut(auth); location.reload(); };

  // Adaptador con la misma interfaz que usa el resto de la app
  return {
    collection: name => ({
      get: async ()=>{
        const s = await F.getDocs(F.collection(fs, name));
        return { docs: s.docs.map(d=>({ id:d.id, data:()=>d.data() })) };
      },
      doc: id => ({
        set: data => F.setDoc(F.doc(fs, name, id), data),
        delete: () => F.deleteDoc(F.doc(fs, name, id))
      })
    })
  };
}

  const box = document.getElementById('agBox'); if(!box) return;
  const evs = hubData.eventos.filter(e=>AGENDA_TIPOS.includes(e.tipo) && e.fecha);
  const tramoDe = e => { const d = diasHasta(e.fecha); return d<0?'pasados': d<=30?'pronto': d<=90?'trimestre':'despues'; };
  const cuenta = t => evs.filter(e=>tramoDe(e)===t && (t==='pasados' || !e.usado)).length;
  const TRAMOS = [['pronto','Próximos 30 días'],['trimestre','31 a 90 días'],['despues','Más adelante'],['pasados','Ya pasaron']];
  let lista = evs.filter(e=>agFiltro.tipo==='todos' || e.tipo===agFiltro.tipo);
  lista = agFiltro.tramo==='todos' ? lista.filter(e=>tramoDe(e)!=='pasados') : lista.filter(e=>tramoDe(e)===agFiltro.tramo);
  lista.sort((a,b)=> agFiltro.tramo==='pasados' ? b.fecha.localeCompare(a.fecha) : (a.usado-b.usado) || a.fecha.localeCompare(b.fecha));
  // Agrupar por mes
  const grupos = {};
  lista.forEach(e=>{ const k = e.fecha.slice(0,7); (grupos[k]=grupos[k]||[]).push(e); });
  const mesTxt = k => new Date(k+'-01T00:00:00').toLocaleDateString('es-MX',{month:'long', year:'numeric'});
  const item = e => {
    const d = new Date(e.fecha+'T00:00:00');
    return `<div class="ag-item ${e.usado?'usado':''}" style="--c:${EVENT_COLORS[e.tipo]||EVENT_COLORS.otro}">
      <div class="ag-fecha"><b>${d.getDate()}</b><span>${d.toLocaleDateString('es-MX',{month:'short'}).replace('.','')}</span></div>
      <div class="ag-body">
        <h4>${esc(e.titulo)}</h4>
        ${e.nota?`<p>${esc(e.nota)}</p>`:''}
        <div class="ag-meta"><span class="ag-badge" style="background:transparent;border:1px solid var(--border-c)">${EVENT_TYPES[e.tipo]||''}</span>${cuentaRegresiva(e)}</div>
        <div class="ag-acc">
          <button onclick="agVerCal('${e.fecha}')">Ver en calendario</button>
          <button onclick="agUsado('${e.id}')">${e.usado?'Desmarcar':(e.tipo==='certificado'?'Marcar como usado':'Marcar como hecho')}</button>
          <button class="del" onclick="agBorrar('${e.id}')">Eliminar</button>
        </div>
      </div>
    </div>`;
  };
  box.innerHTML = `
    <div class="ag-sum">${TRAMOS.map(([k,l])=>`<button class="${agFiltro.tramo===k?'on':''}" onclick="agTramo('${k}')"><div class="n">${cuenta(k)}</div><div class="l">${l}</div></button>`).join('')}</div>
    <div class="ag-filtros">
      ${[['todos','Todos'],['certificado','Certificados'],['curso','Cursos'],['evento','Eventos']].map(([k,l])=>`<button class="ag-chip ${agFiltro.tipo===k?'on':''}" onclick="agTipo('${k}')">${l}</button>`).join('')}
      <button class="ag-chip ${agFiltro.tramo==='todos'?'on':''}" onclick="agTramo('todos')">Todo lo próximo</button>
    </div>
    ${Object.keys(grupos).map(k=>`<p class="ag-grupo">${mesTxt(k)}</p>${grupos[k].map(item).join('')}`).join('')
      || (evs.length ? vacio('🗓️','Nada en este rango','Prueba con otro filtro o revisa todo lo próximo.','Ver todo lo próximo',"agTramo('todos')")
                 : vacio('🎓','Aún no tienes cursos ni eventos','Agrega certificados, talleres o eventos para ver cuánto falta y no dejar que venzan.','Agregar el primero',"document.querySelector('#agBox details').open=true;document.getElementById('ag_titulo').focus()"))}
    <details class="card mt-5" style="padding:1rem">
      <summary class="text-sm font-semibold">Agregar curso, certificado o evento</summary>
      <div class="grid sm:grid-cols-2 gap-2 mt-3">
        <input id="ag_titulo" placeholder="Nombre (ej. Taller de costos)" class="sm:col-span-2">
        <select id="ag_tipo"><option value="curso">Curso / taller</option><option value="evento">Evento</option><option value="certificado">Certificado (vencimiento)</option></select>
        <input id="ag_fecha" type="date" value="${ymd(new Date())}">
        <input id="ag_nota" placeholder="Nota: lugar, quién lo da, qué incluye…" class="sm:col-span-2">
        <button class="btn-primary sm:col-span-2" onclick="agAgregar()">Guardar</button>
      </div>
    </details>`;
}
window.agTramo = t => { agFiltro.tramo = t; pintarAgenda(); };
window.agTipo = t => { agFiltro.tipo = t; pintarAgenda(); };
window.agVerCal = f => { goHome(); setTimeout(()=>calPick(f, true), 50); };
window.agUsado = async id => {
  const e = hubData.eventos.find(x=>x.id===id); if(!e) return;
  const {id:_, ...data} = e; data.usado = !e.usado;
  try{ await docSet('eventos', id, data); e.usado = data.usado; pintarAgenda(); }catch(err){}
};
window.agBorrar = async id => {
  const e = hubData.eventos.find(x=>x.id===id);
  try{ await docDelete('eventos', id); hubData.eventos = hubData.eventos.filter(x=>x.id!==id); pintarAgenda(); }catch(err){}
};
window.agAgregar = async () => {
  const titulo = document.getElementById('ag_titulo').value.trim();
  const fecha = document.getElementById('ag_fecha').value;
  if(!titulo || !fecha){ alert('Escribe el nombre y la fecha.'); return; }
  const ev = {titulo, fecha, tipo:document.getElementById('ag_tipo').value, nota:document.getElementById('ag_nota').value.trim()};
  const id = uid();
  try{ await docSet('eventos', id, ev); hubData.eventos.push({id, ...ev}); pintarAgenda(); }catch(err){}
};

// ---- DASHBOARD ----
RENDERERS.dashboard = async function(){
  $view.innerHTML = `<h2 class="text-lg font-bold mb-3">Dashboard</h2>
    <div id="kpiRow" class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-4"></div>
    <div class="grid sm:grid-cols-2 gap-4">
      <div class="chart-card"><p class="chart-title">📈 Tendencia de ventas (mes)</p><canvas id="chTrend" height="190"></canvas></div>
      <div class="chart-card"><p class="chart-title">🍫 Sabores más vendidos</p><canvas id="chFlavor" height="190"></canvas></div>
      <div class="chart-card"><p class="chart-title">⚡ Velocidad de venta (unid/semana)</p><canvas id="chSpeed" height="190"></canvas></div>
      <div class="chart-card"><p class="chart-title">🧁 % venta por estilo (últ. 30 días)</p><canvas id="chStyle" height="190"></canvas></div>
      <div class="chart-card"><p class="chart-title">⏱️ Rotación por tipo de venta (días prod → venta)</p><canvas id="chRotTipo" height="190"></canvas></div>
      <div class="chart-card"><p class="chart-title">🍫 Rotación por sabor (días)</p><canvas id="chRotSabor" height="190"></canvas></div>
      <div class="chart-card sm:col-span-2"><p class="chart-title">👤 Rotación por cliente / nombre de venta (días, top por monto)</p><canvas id="chRotCli" height="190"></canvas></div>
      <div class="chart-card sm:col-span-2"><p class="chart-title">💰 Semanas sin cerrar: pronosticado vs asignado</p><canvas id="chWeeks" height="150"></canvas></div>
    </div>`;
  applyChartDefaults();
  const ventas = await colGet('ventas');
  const validas = ventas.filter(v=>v.estado==='venta');

  // KPIs
  const mesActual = new Date().toISOString().slice(0,7);
  const ventasMes = validas.filter(v=>(v.fecha||'').slice(0,7)===mesActual);
  const totalMes = ventasMes.reduce((a,v)=>a+num(v.monto),0);
  const ticketProm = ventasMes.length? totalMes/ventasMes.length : 0;
  const bySaborCantKPI = {};
  validas.forEach(v=>ventaItems(v).forEach(i=>{ if(!i.sabor) return; bySaborCantKPI[i.sabor]=(bySaborCantKPI[i.sabor]||0)+(num(i.piezas)||1); }));
  const topSabor = Object.entries(bySaborCantKPI).sort((a,b)=>b[1]-a[1])[0];
  const pendientes = ventas.filter(v=>v.estado==='venta' && !v.pagado).length;
  document.getElementById('kpiRow').innerHTML = `
    <div class="kpi"><p class="lbl">Ventas este mes</p><p class="val">${money(totalMes)}</p></div>
    <div class="kpi"><p class="lbl">Ticket promedio</p><p class="val">${money(ticketProm)}</p></div>
    <div class="kpi"><p class="lbl">Sabor top</p><p class="val" style="font-size:1rem">${topSabor?topSabor[0]:'—'}</p></div>
    <div class="kpi"><p class="lbl">Ventas por cobrar</p><p class="val">${pendientes}</p></div>`;

  // Tendencia mensual
  const byMonth = {};
  validas.forEach(v=>{ const k=(v.fecha||'').slice(0,7); if(!k)return; byMonth[k]=(byMonth[k]||0)+num(v.monto); });
  const monthKeys = Object.keys(byMonth).sort();
  new Chart(document.getElementById('chTrend'), {type:'line', data:{labels:monthKeys, datasets:[{label:'Ventas $', data:monthKeys.map(k=>byMonth[k]), borderColor:PALETTE[0], backgroundColor:'rgba(201,146,47,.18)', fill:true, tension:.35, pointBackgroundColor:PALETTE[1], pointRadius:4}]}, options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, grid:{color:'rgba(234,217,180,.4)'}}, x:{grid:{display:false}}}}});

  // Sabores más vendidos
  const flavorKeys = Object.keys(bySaborCantKPI).sort((a,b)=>bySaborCantKPI[b]-bySaborCantKPI[a]).slice(0,8);
  new Chart(document.getElementById('chFlavor'), {type:'bar', data:{labels:flavorKeys, datasets:[{label:'Unidades', data:flavorKeys.map(k=>bySaborCantKPI[k]), backgroundColor:PALETTE, borderRadius:6}]}, options:{plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, grid:{color:'rgba(234,217,180,.4)'}}, x:{grid:{display:false}}}}});

  // Velocidad de venta
  const speed = {};
  Object.keys(bySaborCantKPI).forEach(s=>{
    const fechas = validas.filter(v=>ventaItems(v).some(i=>i.sabor===s)).map(v=>new Date(v.fecha)).filter(d=>!isNaN(d));
    if(!fechas.length) return;
    const min = new Date(Math.min(...fechas));
    const weeks = Math.max(1,(Date.now()-min)/(7*86400000));
    speed[s] = bySaborCantKPI[s]/weeks;
  });
  const speedKeys = Object.keys(speed).sort((a,b)=>speed[b]-speed[a]).slice(0,8);
  new Chart(document.getElementById('chSpeed'), {type:'bar', data:{labels:speedKeys, datasets:[{label:'Unid/semana', data:speedKeys.map(k=>speed[k].toFixed(1)), backgroundColor:PALETTE[1], borderRadius:6}]}, options:{indexAxis:'y', plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true, grid:{color:'rgba(234,217,180,.4)'}}, y:{grid:{display:false}}}}});

  // % por estilo ultimo mes
  const hace30 = Date.now()-30*86400000;
  const ultimoMes = validas.filter(v=>new Date(v.fecha).getTime()>=hace30);
  const byTipo = {};
  ultimoMes.forEach(v=>{ const k=TIPO_LABEL[v.tipo]||v.tipo||'—'; byTipo[k]=(byTipo[k]||0)+num(v.monto); });
  new Chart(document.getElementById('chStyle'), {type:'doughnut', data:{labels:Object.keys(byTipo), datasets:[{data:Object.values(byTipo), backgroundColor:PALETTE, borderColor:'var(--card-bg)', borderWidth:2}]}, options:{cutout:'62%', plugins:{legend:{position:'bottom'}}}});

  // Rotación (días entre producción y venta, ponderada)
  const rotOpts = (horiz)=>({indexAxis:horiz?'y':'x', plugins:{legend:{display:false}, tooltip:{callbacks:{label:c=>c.parsed[horiz?'x':'y'].toFixed(1)+' días'}}}, scales:{[horiz?'x':'y']:{beginAtZero:true, grid:{color:'rgba(234,217,180,.4)'}}, [horiz?'y':'x']:{grid:{display:false}}}});
  const conDias = validas.filter(v=>diasVenta(v)!=null);
  const rTipo = rotacionPor(conDias, v=>[[TIPO_LABEL[v.tipo]||v.tipo, num(v.monto)||1, diasVenta(v)]]).sort((a,b)=>a.dias-b.dias);
  new Chart(document.getElementById('chRotTipo'), {type:'bar', data:{labels:rTipo.map(r=>r.k+' ('+r.n+')'), datasets:[{data:rTipo.map(r=>+r.dias.toFixed(1)), backgroundColor:PALETTE, borderRadius:6}]}, options:rotOpts(false)});
  const rSab = rotacionPor(validas, v=>ventaItems(v).map(i=>[i.sabor, num(i.piezas)||1, diasEntre(i.fechaProduccion||v.fechaProduccion, v.fecha)])).sort((a,b)=>a.dias-b.dias).slice(0,10);
  if(rSab.length) new Chart(document.getElementById('chRotSabor'), {type:'bar', data:{labels:rSab.map(r=>r.k+' ('+r.n+')'), datasets:[{data:rSab.map(r=>+r.dias.toFixed(1)), backgroundColor:PALETTE[1], borderRadius:6}]}, options:rotOpts(true)});
  else document.getElementById('chRotSabor').parentElement.insertAdjacentHTML('beforeend','<p class="text-xs" style="color:var(--text-soft)">Despliega una venta en Ventas y anota sus sabores para ver la rotación por sabor.</p>');
  const nomCli = v=>String(v.cliente||'').trim().toLowerCase();
  const cliTop = {}; conDias.forEach(v=>{ const k=nomCli(v); if(k) cliTop[k]=(cliTop[k]||0)+num(v.monto); });
  const rCli = rotacionPor(conDias, v=>[[nomCli(v), num(v.monto)||1, diasVenta(v)]]).filter(r=>r.n>=2).sort((a,b)=>(cliTop[b.k]||0)-(cliTop[a.k]||0)).slice(0,12);
  new Chart(document.getElementById('chRotCli'), {type:'bar', data:{labels:rCli.map(r=>r.k.replace(/^./,c=>c.toUpperCase())+' ('+r.n+')'), datasets:[{data:rCli.map(r=>+r.dias.toFixed(1)), backgroundColor:PALETTE[2]||PALETTE[0], borderRadius:6}]}, options:rotOpts(true)});

  // Semanas sin cerrar
  const byWeek = {};
  validas.forEach(v=>{
    const wk = isoWeekKey(v.fecha||Date.now());
    byWeek[wk] = byWeek[wk] || {bruto:0, asignado:0, abierta:false};
    byWeek[wk].bruto += num(v.monto);
    if(v.pagado) byWeek[wk].asignado += num(v.monto); else byWeek[wk].abierta = true;
  });
  const openWeeks = Object.keys(byWeek).filter(k=>byWeek[k].abierta).sort();
  new Chart(document.getElementById('chWeeks'), {type:'bar', data:{labels:openWeeks, datasets:[
    {label:'Pronosticado bruto', data:openWeeks.map(k=>byWeek[k].bruto), backgroundColor:PALETTE[0], borderRadius:5},
    {label:'Asignado (pagado)', data:openWeeks.map(k=>byWeek[k].asignado), backgroundColor:PALETTE[1], borderRadius:5},
  ]}, options:{plugins:{legend:{position:'bottom'}}, scales:{y:{beginAtZero:true, grid:{color:'rgba(234,217,180,.4)'}}, x:{grid:{display:false}}}}});
};

      <div class="card p-3 mb-3" id="insForm">

        </div>

        <thead><tr><th>Nombre</th><th>Dónde</th><th>Presentación</th><th>Costo/unid. estándar</th><th></th></tr></thead>
        <tbody>${insumos.map(i=>{
          const est = costoEstandarInsumo(i);
          const nombreHtml = i.link ? `<a href="${esc(i.link)}" target="_blank" rel="noopener" style="text-decoration:underline;text-decoration-color:var(--border-c)">${esc(i.nombre)}</a>` : esc(i.nombre);

  window.addInsumo = async ()=>{
    const nombre=document.getElementById('i_nombre').value.trim(); if(!nombre){ alert('Escribe el nombre del insumo.'); return; }

    const campos = {
      nombre, dondeCompra: document.getElementById('i_donde').value.trim(),
      presentacion: document.getElementById('i_pres').value.trim(),
      link: /^https?:\/\//i.test(link) ? link : '',

    showSaving(true);

  };

        <button class="btn-primary px-3 py-1.5 text-sm" onclick="addSabor()">Agregar sabor</button>
      </div>
      <div class="space-y-3">${sabores.map(s=>{
        const costo = costoProduccionSabor(s, insumosMap);
        const recomendado = costo/0.6; // 40% de margen sobre el precio
        const margen = s.precioReal ? ((num(s.precioReal)-costo)/num(s.precioReal)*100) : null;
        const rinde = num(s.rinde)||1;
        const costoTanda = (s.insumosUsados||[]).reduce((a,u)=>{ const ins=insumosMap[u.insumoId]; return a + (ins? costoUnitarioInsumo(ins)*num(u.cantidad):0); },0);
        return `<div class="card p-3">
          <div class="flex justify-between items-center cursor-pointer gap-3 flex-wrap" onclick="toggleSabor('${s.id}')">
            <p class="font-semibold">${esc(s.nombre)}</p>
            <p class="text-xs" style="color:var(--text-soft)">Costo ${money(costo)} por pza · Recom. ${money(recomendado)} · Real ${s.precioReal?money(s.precioReal):'—'} · Margen ${margen!==null?margen.toFixed(0)+'%':'—'}</p>
          </div>
          <div id="det_${s.id}" class="${saboresAbiertos.has(s.id)?'':'hidden '}mt-3 space-y-2">
            <p class="text-xs" style="color:var(--text-soft)">Tanda: ${money(costoTanda)} en insumos · rinde ${rinde} pzas</p>
            <div class="scrollx"><table><thead><tr><th>Insumo</th><th>Cantidad</th><th>Costo</th><th></th></tr></thead>
            <tbody>${(s.insumosUsados||[]).map((u,idx)=>{
              const ins=insumosMap[u.insumoId];
              return `<tr><td>${ins?ins.nombre:'?'}</td><td>${u.cantidad} ${ins?ins.unidad:''}</td><td>${ins?money(costoUnitarioInsumo(ins)*u.cantidad):'—'}</td>
              <td><button class="text-xs" style="color:var(--danger)" onclick="rmInsumoSabor('${s.id}',${idx})">quitar</button></td></tr>`;
            }).join('')}</tbody></table></div>
            <div class="flex gap-2 flex-wrap items-end text-sm">
              <select id="add_ins_${s.id}">${insumos.map(i=>`<option value="${i.id}">${i.nombre}</option>`).join('')}</select>
              <input id="add_cant_${s.id}" type="number" placeholder="Cantidad" style="width:100px">
              <button class="btn-soft px-2 py-1 text-xs" onclick="addInsumoSabor('${s.id}')">Agregar insumo</button>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-5 gap-2 text-sm mt-2">
              <label class="text-xs">Rinde (pzas por tanda)<input type="number" step="any" value="${s.rinde||1}" onchange="updSabor('${s.id}','rinde',this.value)"></label>
              <label class="text-xs">Mano de obra (por pza)<input type="number" step="any" value="${s.manoObra||0}" onchange="updSabor('${s.id}','manoObra',this.value)"></label>
              <label class="text-xs">Empaque (por pza)<input type="number" step="any" value="${s.empaque||0}" onchange="updSabor('${s.id}','empaque',this.value)"></label>
              <label class="text-xs">Precio real<input type="number" step="any" value="${s.precioReal||''}" onchange="updSabor('${s.id}','precioReal',this.value)"></label>
              <button class="text-xs self-end" style="color:var(--danger)" onclick="delSabor('${s.id}')">eliminar sabor</button>
            </div>
          </div>
        </div>`;

  window.toggleSabor = id => {
    const el = document.getElementById('det_'+id); if(!el) return;
    el.classList.toggle('hidden');
    if(el.classList.contains('hidden')) saboresAbiertos.delete(id); else saboresAbiertos.add(id);
  };
  window.addSabor = async()=>{
    const n=document.getElementById('s_nombre').value.trim(); if(!n){ alert('Escribe el nombre del sabor.'); return; }
    try{ await docSet('sabores', uid(), {nombre:n, insumosUsados:[], manoObra:0, empaque:0, precioReal:0, rinde:1}); renderSubSabores(); }catch(e){}
  };
  window.cargarRecetasIniciales = async ()=>{
    const db = await ensureDB();
    if(!db){ alert('El almacenamiento aún no está listo. Espera un momento e inténtalo de nuevo.'); return; }
    const [sabores, insumos] = await Promise.all([colGet('sabores'), colGet('insumos')]);
    if(!insumos.length){ alert('Primero carga tus insumos (pestaña Insumos → Cargar lista).'); return; }
    const idPorNombre = {};
    insumos.forEach(i=>{ idPorNombre[String(i.nombre||'').trim().toLowerCase()] = i.id; });
    const nombresS = new Set(sabores.map(s=>String(s.nombre||'').trim().toLowerCase()));
    const nuevas = RECETAS_INICIALES.filter(r=>!nombresS.has(r.nombre.toLowerCase()));
    const noEncontrados = new Set();
    const docs = nuevas.map(r=>({
      nombre:r.nombre, tipo:r.tipo, rinde:r.rinde, manoObra:0, empaque:0, precioReal:0,
      insumosUsados: r.items.map(it=>{
        const id = idPorNombre[it.insumo.trim().toLowerCase()];
        if(!id){ noEncontrados.add(it.insumo); return null; }
        return {insumoId:id, cantidad:it.cantidad};
      }).filter(Boolean)
    }));
    if(noEncontrados.size){ alert('Faltan estos insumos: '+[...noEncontrados].join(', ')+'. Cárgalos primero y vuelve a intentar.'); return; }
    showSaving(true);
    try{
      await Promise.all(docs.map(d=>db.collection('sabores').doc(uid()).set(d)));
      alert('Listo: se cargaron '+docs.length+' recetas.');
    }catch(e){
      console.error(e);
      alert('No se pudieron cargar las recetas ('+(e && e.code ? e.code : 'error')+').');
    }finally{ showSaving(false); }
    renderSubSabores();
  };
  window.delSabor = async(id)=>{ try{ await docDelete('sabores', id); renderSubSabores(); }catch(e){} };
  window.addInsumoSabor = async(sid)=>{
    const insId = document.getElementById('add_ins_'+sid).value;
    const cant = num(document.getElementById('add_cant_'+sid).value);
    if(!cant){ alert('Indica una cantidad.'); return; }
    const sabores = await colGet('sabores'); const s = sabores.find(x=>x.id===sid);
    const list = s.insumosUsados||[]; list.push({insumoId:insId, cantidad:cant});
    try{ await docSet('sabores', sid, {...s, insumosUsados:list}); renderSubSabores(); }catch(e){}
  };
  window.rmInsumoSabor = async(sid, idx)=>{
    const sabores = await colGet('sabores'); const s = sabores.find(x=>x.id===sid);
    const list = (s.insumosUsados||[]).filter((_,i)=>i!==idx);
    try{ await docSet('sabores', sid, {...s, insumosUsados:list}); renderSubSabores(); }catch(e){}
  };
  window.updSabor = async(sid, field, val)=>{
    const sabores = await colGet('sabores'); const s = sabores.find(x=>x.id===sid);
    try{ await docSet('sabores', sid, {...s, [field]: field==='precioReal'||field==='manoObra'||field==='empaque'||field==='rinde'? num(val): val}); renderSubSabores(); }catch(e){}
  };

  async function renderSubFijos(){
    const fijosArr = await colGet('config');
    const fijos = fijosArr.find(f=>f.id==='costosFijos') || {manoObraHora:0, gas:0, depreciacion:0};
    document.getElementById('insSub').innerHTML = `<div class="card p-3 grid grid-cols-2 sm:grid-cols-3 gap-3 text-sm">
      <label>Mano de obra / hora<input id="f_mano" type="number" value="${fijos.manoObraHora||0}"></label>
      <label>Gas (mensual)<input id="f_gas" type="number" value="${fijos.gas||0}"></label>
      <label>Depreciación (mensual)<input id="f_dep" type="number" value="${fijos.depreciacion||0}"></label>
      <button class="btn-primary px-3 py-1.5 col-span-2 sm:col-span-3" onclick="saveFijos()">Guardar</button>
    </div>`;
  }
  window.saveFijos = async()=>{
    try{
      await docSet('config','costosFijos', {manoObraHora:num(document.getElementById('f_mano').value), gas:num(document.getElementById('f_gas').value), depreciacion:num(document.getElementById('f_dep').value)});
      renderSubFijos();
    }catch(e){}
  };
};

function ventaItems(v){

  if(v.sabor) return [{sabor:v.sabor, piezas:num(v.cantidad), fechaProduccion:''}];

function diasEntre(prod, vend){
  if(!prod || !vend) return null;
  const a = new Date(String(prod).slice(0,10)+'T00:00:00'), b = new Date(String(vend).slice(0,10)+'T00:00:00');
  const d = Math.round((b-a)/86400000);
  return (isNaN(d) || d<0) ? null : d;
}
// Días de rotación de la venta (producción → venta)
function diasVenta(v){ return diasEntre(v.fechaProduccion, v.fecha); }
function rotacionPor(ventas, keyFn, pesoFn){
  const acc = {};
  ventas.forEach(v=> keyFn(v).forEach(([k,peso,dias])=>{
    if(dias==null || !k) return;
    const o = acc[k] = acc[k] || {sumP:0, sumPD:0, n:0, min:Infinity, max:0};
    o.sumP += peso; o.sumPD += peso*dias; o.n++; o.min=Math.min(o.min,dias); o.max=Math.max(o.max,dias);
  }));
  return Object.entries(acc).map(([k,o])=>({k, dias:o.sumPD/(o.sumP||1), n:o.n, min:o.min, max:o.max}));
}

const SHEETS_SCRIPT = `// Pega esto en Extensiones → Apps Script de tu Google Sheet (borra lo que haya)

function hoja_(){

  if((e.parameter.token||'') !== TOKEN) return salida_({error:'token'});

  if(n > 1){
    sh.getRange(2,1,n-1,COLS.length).getValues().forEach((r,i)=>{
      if(r.every(c=>c==='')) return;

      const arr = COLS.map(c=> r[c] === undefined ? '' : r[c]);
      if(ids[r.id]) sh.getRange(ids[r.id],1,1,COLS.length).setValues([arr]); else nuevas.push(arr);
    });
    if(nuevas.length) sh.getRange(sh.getLastRow()+1,1,nuevas.length,COLS.length).setValues(nuevas);
    return salida_({ok:true, nuevas:nuevas.length});

}

function filaAVenta(r, base){

async function sheetsSync(silencioso){

  try{
    const r = await fetch(cfg.url+(cfg.url.includes('?')?'&':'?')+'token='+encodeURIComponent(cfg.token));
    const j = await r.json(); if(j.error) throw new Error(j.error==='token'?'La clave no coincide con la del script.':j.error);
    const hoja = j.rows||[];
    const ventas = await colGet('ventas'); const porId = Object.fromEntries(ventas.map(v=>[v.id,v]));

    const db = await ensureDB();
    for(const f of hoja){
      let id = String(f.id||'').trim();
      if(!id){ id = uid(); setIds.push({row:f.row, id}); }
      enHoja.add(id);
      const v = porId[id]; const tsHoja = num(f.actualizado);
      if(!v){
        if(!String(f.cliente||'').trim() && !num(f.monto)) continue;
        await docSet('ventas', id, {...filaAVenta(f,null), pagado:/^(si|sí|true|1|x|pagado)/i.test(String(f.pagado||'')), _ts:tsHoja||Date.now(), _noSync:true}); bajados++;
        if(!tsHoja || setIds.some(s=>s.id===id)) subir.push(ventaAFila({...filaAVenta(f,null), id, actualizado:Date.now()}));
        continue;
      }
      const filaApp = ventaAFila(v);
      if(claveFila(filaApp) === claveFila({...f, monto:num(f.monto)})) continue;
      if(tsHoja > num(v.actualizado)){ await docSet('ventas', id, {...filaAVenta(f,v), _ts:tsHoja, _noSync:true}); bajados++; }

    }

    for(let i=0;i<Math.max(subir.length,1);i+=150){

}

    document.getElementById('ventasList').innerHTML = `<table>
      <thead><tr><th></th><th>Fecha</th><th>Cliente</th><th>Tipo</th><th>Estado</th><th>Pago</th><th>Sabores</th><th>Rotación</th><th>Monto</th><th>Coment.</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="11" style="white-space:normal;padding:1rem">'+vacio('🧾','Sin ventas que mostrar','Si usaste filtros, quítalos. Si es tu primera vez, registra una venta en segundos.','+ Nueva venta','abrirVentaRapida()')+'</td></tr>'}</tbody></table>
      ${total>ventas.length ? `<div class="text-center mt-2"><button class="btn-soft px-3 py-1 text-xs" onclick="ventasVerTodo()">Ver las ${total} ventas</button></div>` : ''}`;

  function itemRow(vid,i,ix){

      <input list="dl_sabores" class="it_sabor" placeholder="Sabor" value="${esc(i.sabor||'')}" style="flex:1;min-width:110px">

  }
  window.ventasFiltrar = ()=>pintar();
  window.ventasVerTodo = ()=>{ verTodo=true; pintar(); };
  window.toggleVenta = (id)=>{ abiertas.has(id)? abiertas.delete(id) : abiertas.add(id); pintar(); };
  window.addItemRow = (id)=>{ document.getElementById('its_'+id).insertAdjacentHTML('beforeend', itemRow(id,{},0)); };
  window.guardarDetalle = async(id)=>{
    const v = (window._ventasCache||[]).find(x=>x.id===id); if(!v) return;
    const items = [...document.querySelectorAll('#its_'+id+' .itemrow')].map(r=>({
      sabor: r.querySelector('.it_sabor').value.trim(), piezas: num(r.querySelector('.it_pzs').value), fechaProduccion: r.querySelector('.it_prod').value||''
    })).filter(i=>i.sabor);
    const fp = document.getElementById('dp_'+id).value||'', fv = document.getElementById('dv_'+id).value||v.fecha||'';
    const upd = {...v, items, fechaProduccion: fp, fecha: fv};

    try{ await docSet('ventas', id, upd); await renderVentasList(); }catch(e){}
  };
  window.addVenta = async()=>{
    try{

      await docSet('ventas', uid(), {
        fecha: document.getElementById('v_fecha').value, fechaProduccion: document.getElementById('v_prod').value, cliente: document.getElementById('v_cliente').value,

        metodoPago: document.getElementById('v_pago').value, sabor: '', cantidad: 0,
        items: sab ? [{sabor:sab, piezas:cant, fechaProduccion:''}] : [],
        monto: num(document.getElementById('v_monto').value),
        comentario: document.getElementById('v_com').value, pagado:false,
      });
      renderVentasList();
    }catch(e){}
  };
  window.marcarPagado = async(id)=>{
    const v = (window._ventasCache||[]).find(x=>x.id===id); const d={...v}; delete d.id;
    try{ await docSet('ventas', id, {...d, pagado:true}); renderVentasList(); }catch(e){}
  };
  window.editarVenta = async(id)=>{
    if(!confirm('¿Seguro que quieres editar esta venta ya cerrada?')) return;
    const v = (window._ventasCache||[]).find(x=>x.id===id); const d={...v}; delete d.id;
    try{ await docSet('ventas', id, {...d, pagado:false}); renderVentasList(); }catch(e){}
  };
  window.cargarVentasIniciales = async()=>{
    const db = await ensureDB();
    if(!db){ alert('El almacenamiento aún no está listo. Espera un momento e inténtalo de nuevo.'); return; }
    const ids = new Set((window._ventasCache||[]).map(v=>v.id));
    const nuevos = VENTAS_INICIALES.filter(x=>!ids.has(x.id));
    if(!nuevos.length) return;
    showSaving(true);
    try{
      for(let i=0;i<nuevos.length;i+=25){
        await Promise.all(nuevos.slice(i,i+25).map(x=>{ const {id,...d}=x; return db.collection('ventas').doc(id).set(d); }));
      }
      alert('Listo: se cargaron '+nuevos.length+' ventas.');
    }catch(e){
      console.error(e);
      alert('No se pudo cargar el historial ('+(e && e.code ? e.code : 'error')+'). Puedes volver a pulsar el botón: sólo cargará lo que falte.');
    }finally{ showSaving(false); }
    renderVentasList();
  };
};

// ---- SIMULACIÓN (matriz tipo hoja de cálculo) ----
const SIM_PH='\u2022';
const isPH = n=>String(n).startsWith(SIM_PH);
const SIM_ORDER=['Brownie Clasico','Brownie Oreo','Brownie Ferrero','Brownie M&M','Brownie de Limon','Brownie Kinder Bueno','Brookie','Brownie de Mazapan','Brownie de Muerto','Brownie Oreo Sin Lactosa','Brownie M&M Sin Lactosa','Cheescake Brownie','Brownie Smoars Sin Lactosa','Carrot Sandwich','Brookie Sin Lactosa','Brownie Reeses'];
const SIM_ROWS_DEF=[['Venta propia','personal'],["Papeleria D'Colores",'puntoVenta'],['ITH','puntoVenta'],['Unison','puntoVenta'],['Carniceria','puntoVenta'],['Cafe Escondido','puntoVenta'],['Mini Brownie','puntoVenta'],['Papeleria Colosio','puntoVenta'],['Venta Estudiante','personal']];
let simCols = []; let simRows = []; let simVals = {}; let simRowTipo = {}; let simSabores = []; let simClientes = []; let simFecha = '';
const SIM_CATS = ['Mantequilla','Aceite','Sin lactosa','Brookie','Muerto','Mazapán','Cheesecake','Carrot Sandwich','Galleta'];
function catDefault(s){
  const n = _acc(s.nombre);
  if(n.includes('brookie')) return 'Brookie';
  if(n.includes('muerto')) return 'Muerto';
  if(n.includes('mazapan')) return 'Mazapán';
  if(n.includes('cheescake')||n.includes('cheesecake')) return 'Cheesecake';
  if(n.includes('carrot')) return 'Carrot Sandwich';
  if(n.includes('galleta')||n.includes('cookie')) return 'Galleta';
  if(s.tipo==='deslactosado') return 'Aceite';
  return 'Mantequilla';
}
const catDe = (s, nombre) => (s && s.categoria) || (s? catDefault(s) : (nombre? catDefault({nombre, tipo:/sin lactosa/i.test(nombre)?'deslactosado':'normal'}) : 'Otro'));
function isoSemana(fechaStr){
  const d = new Date(fechaStr+'T00:00:00'); const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dn = t.getUTCDay()||7; t.setUTCDate(t.getUTCDate()+4-dn);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(),0,1));
  return {n: Math.ceil(((t-y0)/86400000+1)/7), y:t.getUTCFullYear()};
}
function lunesDe(fechaStr){
  const d = new Date(fechaStr+'T00:00:00'); const dn = d.getDay()||7; d.setDate(d.getDate()-(dn-1));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function simGuardarBorrador(){ try{ localStorage.setItem('sim_draft_v2', JSON.stringify({simCols,simRows,simVals,simRowTipo,simFecha})); }catch(e){} }
function simCargarBorrador(){ try{ const d = JSON.parse(localStorage.getItem('sim_draft_v2')||'null'); if(d && Object.keys(d.simVals||{}).length){ simCols=d.simCols||[]; simRows=d.simRows||[]; simVals=d.simVals||{}; simRowTipo=d.simRowTipo||{}; simFecha=d.simFecha||''; } }catch(e){} }
const kc = (r,c)=>r+'\u0001'+c;
function evalCelda(txt){
  const t = String(txt||'').replace(/^=/,'').replace(/,/g,'.').trim();
  if(!t) return 0;
  if(!/^[\d.+\-*\/() ]+$/.test(t)) return 0;
  try{ const v = Function('"use strict";return ('+t+')')(); return isFinite(v)&&v>0 ? Math.round(v*100)/100 : 0; }catch(e){ return 0; }
}


function simDefaults(){
  const mapa = Object.fromEntries(simSabores.map(s=>[nkey(s.nombre), s.nombre]));
  simCols = SIM_ORDER.map(n=>mapa[nkey(n)]||n);
  simRows = SIM_ROWS_DEF.map(r=>r[0]); simRowTipo = Object.fromEntries(SIM_ROWS_DEF); simVals = {};
}
function simSiguienteSabor(){
  const libres = simSabores.filter(s=>!simCols.includes(s.nombre));
  libres.sort((a,b)=>{ const ia=SIM_ORDER.indexOf(a.nombre), ib=SIM_ORDER.indexOf(b.nombre); return (ia<0?99:ia)-(ib<0?99:ib) || String(a.nombre).localeCompare(String(b.nombre),'es'); });
  return libres[0] ? libres[0].nombre : null;
}
const fechaCorta = f=>{ const d=new Date(f+'T00:00:00'); return isNaN(d)?'':d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear(); };

RENDERERS.simulacion = async function(){
  [simSabores, simClientes] = await Promise.all([colGet('sabores'), colGet('clientes')]);

window.simPintarEtiqueta = ()=>{ const el=document.getElementById('sim_sem_lbl'); if(el&&simFecha){ const w=isoSemana(simFecha); el.textContent='Semana '+w.n+' · lunes '+lunesDe(simFecha); } };
window.simLimpiar = ()=>{ simVals={}; simGuardarBorrador(); simRender(); };
window.simCargarSemana = (id)=>{
  const p = (window._simProd||[]).find(x=>x.id===id); if(!p) return;
  if((simCols.length||simRows.length) && !confirm('Esto reemplaza lo que hay en la tabla. ¿Continuar?')){ document.getElementById('sim_cargar').value=''; return; }
  simCols=[]; simRows=[]; simVals={}; simRowTipo={};
  (p.items||[]).forEach(i=>{
    if(!simCols.includes(i.sabor)) simCols.push(i.sabor);
    if(!simRows.includes(i.cliente)){ simRows.push(i.cliente); simRowTipo[i.cliente]=i.tipo||''; }
    simVals[kc(i.cliente,i.sabor)] = (simVals[kc(i.cliente,i.sabor)]||0)+num(i.cantidad);
  });
  simFecha = p.semana || simFecha; document.getElementById('sim_semana').value = simFecha; simPintarEtiqueta();
  simGuardarBorrador(); simRender();
};

function simTotales(){
  const colT = {}, rowT = {}, catT = {};
  simCols.forEach(c=>colT[c]=0); simRows.forEach(r=>rowT[r]=0);
  simRows.forEach(r=>simCols.forEach(c=>{ const v=num(simVals[kc(r,c)]); if(v>0){ colT[c]+=v; rowT[r]+=v; } }));
  const sm = Object.fromEntries(simSabores.map(s=>[s.nombre,s]));
  simCols.forEach(c=>{ const cat = catDe(sm[c], c); catT[cat]=(catT[cat]||0)+colT[c]; });
  return {colT,rowT,catT, total:Object.values(colT).reduce((a,b)=>a+b,0)};
}
const f2 = n=>(Math.round(n*100)/100).toFixed(2);
function simRender(){

      </thead>
      <tbody>
        ${simRows.map((r,ri)=>`<tr><th class="sim-r">${isPH(r) ? `<input class="sim-rn" list="dl_simcli" placeholder="Destino…" data-r="${esc(r)}" onchange="simNombrarRow(this)">` : `<span>${esc(r)}</span>`}<button class="sim-x" title="Quitar fila" onclick="simQuitarRow(this.dataset.r)" data-r="${esc(r)}">✕</button></th>
          ${simCols.map((c,ci)=>`<td class="sim-c"><input class="sim-cell" inputmode="decimal" data-r="${esc(r)}" data-c="${esc(c)}" data-ri="${ri}" data-ci="${ci}" value="${num(simVals[kc(r,c)])||''}" onfocus="this.select()" oninput="simEdit(this)" onblur="simBlur(this)" onkeydown="simKey(event,this)"></td>`).join('')}
          <td class="sim-c sim-blank"></td><td class="sim-tot" data-rt="${esc(r)}">${T.rowT[r]||0}</td><td class="sim-tot" data-rd="${esc(r)}">${f2((T.rowT[r]||0)/12)}</td></tr>`).join('')}

      </tbody></table></div>

function simTipos(T){

function simRefrescarTotales(){
  const T = simTotales();
  document.querySelectorAll('[data-rt]').forEach(el=>el.textContent = T.rowT[el.dataset.rt]||0);
  document.querySelectorAll('[data-rd]').forEach(el=>el.textContent = f2((T.rowT[el.dataset.rd]||0)/12));
  document.querySelectorAll('[data-ct]').forEach(el=>el.textContent = T.colT[el.dataset.ct]||0);
  document.querySelectorAll('[data-cd]').forEach(el=>el.textContent = f2((T.colT[el.dataset.cd]||0)/12));

function simAgregarCol(){ const n = simSiguienteSabor(); if(!n) return false; simCols.push(n); return true; }

window.simHandle = (ev, modo)=>{
  ev.preventDefault(); ev.stopPropagation();
  const x0=ev.clientX, y0=ev.clientY, paso = modo==='col' ? 92 : 26;
  let agregados=[], movido=false;
  const mover = e=>{
    const d = modo==='col' ? e.clientX-x0 : e.clientY-y0;
    if(Math.abs(d)>6) movido=true;
    const objetivo = Math.max(0, Math.floor(d/paso));
    let cambio=false;
    while(agregados.length<objetivo){
      if(modo==='col'){ if(!simAgregarCol()) break; agregados.push(simCols[simCols.length-1]); }
      else{ simAgregarRow(); agregados.push(simRows[simRows.length-1]); }
      cambio=true;
    }
    while(agregados.length>objetivo){
      const u = agregados[agregados.length-1];
      if(modo==='col'){ if(simRows.some(r=>simVals[kc(r,u)])) break; simCols = simCols.filter(c=>c!==u); }
      else{ if(simCols.some(c=>simVals[kc(u,c)])) break; simRows = simRows.filter(r=>r!==u); delete simRowTipo[u]; }
      agregados.pop(); cambio=true;
    }
    if(cambio){ simRender(); simDesplazarFin(modo); }
  };
  const soltar = ()=>{
    document.removeEventListener('pointermove',mover); document.removeEventListener('pointerup',soltar); document.removeEventListener('pointercancel',soltar);
    if(!movido){
      if(modo==='col'){ if(!simAgregarCol()) toast('Ya agregaste todos los sabores.', {tipo:'info'}); }
      else simAgregarRow();
      simRender(); simDesplazarFin(modo);
    }
    simGuardarBorrador();
    if(modo==='row'){ const i=document.querySelector('.sim-rn'); if(i && !movido) i.focus(); }
  };
  document.addEventListener('pointermove',mover); document.addEventListener('pointerup',soltar); document.addEventListener('pointercancel',soltar);
};
function simDesplazarFin(modo){ const sc=document.getElementById('simScroll'); if(!sc) return; if(modo==='col') sc.scrollLeft=sc.scrollWidth; else sc.scrollTop=sc.scrollHeight; }
window.simSetCat = async sel=>{

window.simGuardar = async()=>{
  const items = [];
  simRows.filter(r=>!isPH(r)).forEach(r=> simCols.forEach(c=>{
    const cant = num(simVals[kc(r,c)]);
    if(cant>0) items.push({sabor:c, cliente:r, tipo:simRowTipo[r]||'', cantidad:cant});
  }));
  if(!items.length){ alert('Agrega cantidades a la tabla primero.'); return; }
  const fecha = document.getElementById('sim_semana').value || simFecha;
  const lunes = lunesDe(fecha), w = isoSemana(fecha);
  const id = 'prodS'+String(w.n).padStart(2,'0')+(w.y===2026?'':'_'+w.y);
  const previa = (window._simProd||[]).find(p=>p.id===id);
  if(previa && !confirm('Ya hay una producción guardada de la semana '+w.n+'. ¿Reemplazarla? (el inventario se ajusta con la diferencia)')) return;
  const sm = Object.fromEntries(simSabores.map(s=>[s.nombre,s]));
  const totales = {}, totalesTipo = {}; let piezas = 0;
  items.forEach(i=>{ totales[i.sabor]=(totales[i.sabor]||0)+i.cantidad; const k=catDe(sm[i.sabor], i.sabor); totalesTipo[k]=(totalesTipo[k]||0)+i.cantidad; piezas+=i.cantidad; });
  try{
    await docSet('producciones', id, {semana:lunes, semanaNum:w.n, items, totales, totalesTipo, piezas});
    const insumos = await colGet('insumos'); const insMap = Object.fromEntries(insumos.map(i=>[i.id,i]));
    const consumo = {};
    const acum = (lista, signo)=>lista.forEach(it=>{
      const s = sm[it.sabor]; if(!s) return;
      (s.insumosUsados||[]).forEach(u=>{ consumo[u.insumoId]=(consumo[u.insumoId]||0)+signo*u.cantidad/(num(s.rinde)||1)*it.cantidad; });
    });
    acum(items, 1); if(previa) acum(previa.items||[], -1);
    for(const [insId, cant] of Object.entries(consumo)){
      const ins = insMap[insId]; if(!ins || !cant) continue;
      const d={...ins}; delete d.id;
      await docSet('insumos', insId, {...d, existencia: num(ins.existencia)-cant});
    }
    simDefaults(); simGuardarBorrador();
    toast('Producción de la semana '+w.n+' guardada ('+piezas+' pzs).', {tipo:'ok'});
    window.go('producciones');
  }catch(e){}
};

async function clientesDesdeRegistros(){

  const ex = new Set(clientes.map(c=>nkey(c.nombre)));

  const add = (nom,tipo)=>{
    const k = nkey(nom); if(!k || NO_CLIENTE.has(k) || /^\d+$/.test(k)) return;
    const o = m[k] = m[k] || {nombre:nombreCanon(nom), tipos:new Set(), n:0}; o.tipos.add(tipo); o.n++;
  };
  const vm = new Map(); VENTAS_INICIALES.forEach(v=>vm.set(v.id,v)); ventasDB.forEach(v=>vm.set(v.id,v));
  vm.forEach(v=>add(v.cliente, v.tipo));
  PRODUCCIONES_INICIALES.forEach(p=>p.items.forEach(i=>add(i.cliente, i.tipo)));
  return Object.entries(m).filter(([k])=>!ex.has(k)).map(([k,o])=>({

    tipo: o.tipos.has('puntoVenta')?'puntoVenta' : o.tipos.has('vendedor')?'vendedor' : 'cliente', desdeRegistros:true}));
}
